name: WD

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: E
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0 -ErrorAction SilentlyContinue
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop" -ErrorAction SilentlyContinue | Out-Null
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 0 -ErrorAction SilentlyContinue

      - name: Cale.msi"
        run: |
          echo "::add-mask::${{ secrets.RDP_PASSWORD }}"
          echo "::add-mask::${{ secrets.RDP_USERNAME }}"
          
          $Password = ConvertTo-SecureString "${{ secrets.RDP_PASSWORD }}" -AsPlainText -Force -ErrorAction SilentlyContinue
          New-LocalUser -Name "${{ secrets.RDP_USERNAME }}" -Password $Password -PasswordNeverExpires -ErrorAction SilentlyContinue | Out-Null
          Add-LocalGroupMember -Group "Administrators" -Member "${{ secrets.RDP_USERNAME }}" -ErrorAction SilentlyContinue | Out-Null

      - name: I
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          echo "::add-mask::$Env:TAILSCALE_AUTHKEY"
          
          Invoke-WebRequest "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" -OutFile "C:\tailscale.msi" -ErrorAction SilentlyContinue > $null
          Start-Process msiexec -ArgumentList "/i C:\tailscale.msi /quiet /norestart" -Wait -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 5
          & "C:\Program Files\Tailscale\tailscale.exe" up --authkey="$Env:TAILSCALE_AUTHKEY" --hostname="github-rdp-server" | Out-Null
          Start-Sleep -Seconds 8
          
          Write-Host "RDP Server setup completed."

      - name: K
        run: |
          for ($i = 1; $i -le 2880; $i++) {
            Start-Sleep -Seconds 60
            # هیچ پیامی چاپ نمی‌شود
          }
